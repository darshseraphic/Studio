<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Argon2id Local Provider Smoke Test</title>
</head>
<body>
<pre id="output">Running…</pre>
<script>
(() => {
  const output = document.getElementById('output');
  const expected = '3fa7c23ef7dfac3e3f6f3ca13987c1ca252b5ac36dc0d5dc01a617aa0fcf0a20';
  const worker = new Worker('../argon2-worker.js');
  const requestId = 1;
  const password = new TextEncoder().encode('StudioTest!');
  const salt = Uint8Array.from(Array.from({ length: 32 }, (_, i) => i));
  const timeout = setTimeout(() => {
    worker.terminate();
    output.textContent = 'FAIL: worker timeout';
  }, 180000);

  worker.addEventListener('message', (event) => {
    const data = event.data || {};
    if (data.requestId !== requestId) return;
    clearTimeout(timeout);
    worker.terminate();

    if (!data.ok) {
      output.textContent = `FAIL: ${data.error || 'unknown error'}`;
      return;
    }
    if (data.provider !== 'local') {
      output.textContent = `FAIL: provider=${data.provider || 'unknown'}; expected local provider`;
      return;
    }

    const bytes = new Uint8Array(data.key);
    const hex = Array.from(bytes, (value) => value.toString(16).padStart(2, '0')).join('');
    output.textContent = hex === expected
      ? 'PASS: local Argon2id v1.3 production vector matched.'
      : `FAIL: expected ${expected}\nreceived ${hex}`;
  });

  worker.addEventListener('error', (event) => {
    clearTimeout(timeout);
    worker.terminate();
    output.textContent = `FAIL: ${event.message || 'worker error'}`;
  });

  worker.postMessage({
    requestId,
    password: password.buffer,
    salt: salt.buffer,
    includeProvider: true,
    kdf: {
      algorithm: 'Argon2id',
      version: 0x13,
      memorySize: 131072,
      iterations: 4,
      parallelism: 1,
      hashLength: 32,
      outputType: 'binary'
    }
  }, [password.buffer, salt.buffer]);
})();
</script>
</body>
</html>
